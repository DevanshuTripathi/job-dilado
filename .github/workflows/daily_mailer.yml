name: Daily Job Mailer

on:
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch: # Manual Trigger

jobs:
  run-mailer:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Mailer Script
        env: 
          APP_PASS: ${{ secrets.APP_PASS }}
        run: python mailer.py

      - name: Persist updated seen_jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: seen_jobs.json [skip ci]" && git push)